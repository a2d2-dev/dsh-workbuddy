[program:workbuddy2api]
command=/opt/workbuddy2api/.venv/bin/uvicorn --app-dir /opt/dsh-workbuddy/server workbuddy_service:create_app --factory --host 127.0.0.1 --port 18788
directory=/opt/dsh-workbuddy
environment=PYTHONUNBUFFERED="1",WORKBUDDY_PROXY_SOURCE="/opt/workbuddy2api",WORKBUDDY_ENDPOINT="https://www.workbuddy.ai",WORKBUDDY_SESSION_FILE="/var/lib/workbuddy2api/session.json",WORKBUDDY_LOGIN_TTL_SECONDS="300",WORKBUDDY_LOG_FILE="/var/log/workbuddy2api/proxy.jsonl"
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/workbuddy2api/stdout.log
stderr_logfile=/var/log/workbuddy2api/stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

[program:workbuddy2api-gateway]
command=/bin/bash -c 'set -a; source /etc/workbuddy2api/gateway.env; exec /usr/local/bin/caddy run --config /etc/workbuddy2api/Caddyfile --adapter caddyfile'
directory=/opt/workbuddy2api
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/workbuddy2api/gateway-stdout.log
stderr_logfile=/var/log/workbuddy2api/gateway-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
